THE THREE-STAGE MODEL (current)
-------------------------------
1. DISPATCH (per SHED): live sheds = order_complete "no" + parent deal
   at Sale (1094492205). Card name = shed hs_name. Target date = shed
   install_date. Drag onto week/day slots → draft → proposed → confirmed
   (colour/finish gate before proposing; confirmed locks; HubSpot
   Proposed/Confirmed set by sales OVERRIDES and locks the app state;
   Planned never does). "✨ Suggest install days" = install-day planner
   (van slots, OSRM drive times, ≤1h legs, 11h day / 8h Mon, Tue-Thu
   London / Mon-Thu local, bank holidays skipped) with JOIN suggestions
   onto already-agreed days first. £ per day/week = shed install_value ÷
   order units; ≈man-hrs + £/hr from speed-model route estimates.
   Day notes in the expanded week view. 📋 For HubSpot = manual handover
   list for Sasha (the app NEVER writes to HubSpot).
2. SCHEDULER (per shed): weekly board + Mon-Fri spray lanes; planning
   date = HS proposed/confirmed date > app proposed date > shed
   install_date (resolvePlanningInfo_ — single source for all views).
   Plan sprays batches colours, most-urgent dispatch first. Capacity =
   man-hours net of Timetastic leave. Chase banners: 📐 SKP/LYT (Dan
   ticks; gates bespoke build start) and 🌿 sedum. Finish-tinted cards.
3. TRACKER (per shed): 10 stages (Cut → Dispatched) + parallel LID
   STATION checkpoint + odd jobs (B1 ply/C lid frame/D base frame). QC
   stages capture fault text + structured issue categories. Dispatched
   → Archive snapshot (restorable). Bespoke jobs warn before starting
   without drawings; Assembled/Dispatched warn without a lid.

KEY FIELD MAPPINGS & TRAPS (all verified live)
----------------------------------------------
- NAMING TRAP #1: shed dispatch DATE = `install_date`. There is NO
  dispatch_date on the Shed; the deal's dispatch_date is stale. (v9)
- NAMING TRAP #2: shed dispatch VALUE (£) = `install_value` — the
  ORDER's dispatch £ stamped on every shed of the order → divide by
  unit count. Deal dispatch_value is empty in practice. (v20)
- dispatch_status stored values are QUIRKY: Planned="true",
  Proposed="false", Confirmed="Confirmed", On hold="On hold" —
  normalizeHsStatus_ maps them all. On-hold comes ONLY from this field;
  a blank dispatch date just means sales haven't entered one.
- hs_name = "job# - Name - shed type - #/#" (empty #/# leaves a
  trailing " - ", trimmed by cleanShedName_). THE display name app-wide.
- The HubSpot MCP connector CANNOT read custom object 0-162 — verify
  shed fields live via ?debug=shednames (see GOTCHAS for the flow).
- Rich-text fields (additional_product_requirements__shed_) arrive
  HTML-encoded — stripHtml strips tags THEN decodes entities.

RESTORE RUNBOOK
---------------
Sheet data damaged/lost:
  a. Open "BSC Hub Backups" in Drive, open last night's snapshot, sanity
     -check it (Jobs/Dispatch/Archive tabs look right).
  b. Small damage: copy the affected tab(s)/rows back into the live
     sheet manually.
  c. Total loss: make a copy of the snapshot, name it
     BSC_ProdTracker_State, and set Script Property STATE_SS_ID to the
     new file's ID (Extensions → Apps Script → Project Settings →
     Script Properties). At most one day of ticks is lost.
Code damaged / bad deploy:
  a. Roll the LIVE APP back instantly: Deploy → Manage deployments →
     edit → select the previous version → Deploy (or `clasp redeploy
     <id> -V <n>`).
  b. Repo lost: `git clone` from GitHub (once wired), or restore from
     the newest OneDrive bundle: `git clone bsc-production-apps-YYYYMMDD.bundle repo`.
Quarterly drill (10 min): open latest snapshot — does it open, do the
tabs look sane? Check the OneDrive Backups folder has recent bundles.

GOTCHAS LEARNED
---------------
- 30-MIN CACHE: fetchLiveData caches the processed snapshot ACROSS
  deployments. After any redeploy, the app can serve a snapshot built by
  the OLD code; browser refresh does NOT clear it — use the app's ⟳
  Refresh, or wait. This has caused two "the fix didn't work" scares.
- Debugging server field mappings: add/extend a ?debug= branch in
  Main.gs, `clasp deploy -d "TEMP"` (new URL), open it logged in as
  dan@, then `clasp delete-deployment <id>`. The @HEAD deployment 404s
  on /exec, so a temp versioned deployment is required.
- Iframe sandbox: relative links don't work in served pages — use
  APP_BASE_URL + target=_top.
- .gs and .html cannot share a basename; clasp create clobbers
  appsscript.json.
- Store.gs contract: null clears, absent skips; never touch the sheet
  outside Store.gs; only APPEND columns (invariant #3).
- storeReadAll skips only fully-empty rows — testing column A broke
  per-shed Dispatch reads once (v13). Don't reintroduce.
- Apps Script evaluates template scriptlets even inside HTML comments —
  an include must never contain its own include syntax literally.
- Sheets auto-parses yyyy-mm-dd into Dates — sheetValueToString_
  normalises on read.
