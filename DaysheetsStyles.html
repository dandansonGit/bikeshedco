<!-- Styles for Daysheets.html — screen entry grid + A4 print (one page per
     station, pen-friendly). NEVER write the include scriptlet syntax
     literally in this file, even in a comment. -->
<style>
    body { min-width: 0; background: #f6f7f6; }

    .date-bar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 14px; background: #fff; border-bottom: 1px solid #ddd;
      position: sticky; top: 0; z-index: 30;   /* keep Save reachable on long days */
    }
    .date-bar input[type=date] { border: 1px solid #ccc; border-radius: 6px; padding: 6px 8px; font-size: 14px; }
    /* .hbtn is styled for the dark header — restyle for white backgrounds */
    .date-bar .hbtn, .add-task .hbtn {
      background: #f2f4f2; color: #234d20; border: 1px solid #bbb;
    }
    .date-bar .hbtn:hover, .add-task .hbtn:hover { background: #e4e9e4; }
    .date-hint { font-size: 12px; color: #999; }
    .save-close { margin-left: auto; }
    .hol-tag { font-size: 12px; font-weight: 700; color: #9c6f00; background: #fff3cd; border-radius: 3px; padding: 2px 8px; }

    .ds-main { padding: 14px; max-width: 1150px; margin: 0 auto; }
    .station {
      background: #fff; border: 1px solid #e0e0e0; border-radius: 10px;
      margin-bottom: 16px; padding: 12px 14px;
    }
    .st-hdr { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
    .st-name { font-size: 17px; font-weight: 800; }
    .st-day { font-size: 13px; color: #666; }
    .st-brand { margin-left: auto; font-size: 11px; color: #bbb; }
    .st-empty { color: #aaa; font-size: 13px; padding: 6px 2px 2px; }

    .st-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .st-tbl th { text-align: left; padding: 5px 7px; border-bottom: 2px solid #ddd; color: #666; }
    .st-tbl td { padding: 5px 7px; border-bottom: 1px solid #eee; vertical-align: middle; }
    .c-n { width: 26px; color: #999; }
    .c-dwg { width: 90px; }
    .c-h { width: 70px; }
    .c-who { width: 110px; }
    .c-done { width: 46px; text-align: center; }
    tr.overdue td { background: #fdf1f0; }
    .ov-tag { font-size: 10px; font-weight: 700; color: #b71c1c; background: #fce4e4; border-radius: 3px; padding: 1px 5px; }
    .ns-tag { font-size: 10px; font-weight: 700; color: #4527a0; background: #ede7f6; border-radius: 3px; padding: 1px 5px; }
    .noest { color: #b71c1c; font-weight: 700; }
    .task-row td { background: #fbfaff; }

    .in-h { width: 58px; border: 1px solid #ccc; border-radius: 5px; padding: 4px 6px; font-size: 13px; }
    .in-who { width: 104px; border: 1px solid #ccc; border-radius: 5px; padding: 4px; font-size: 13px; }
    .in-notes { width: 100%; border: 1px solid #ddd; border-radius: 5px; padding: 4px 6px; font-size: 13px; }

    .add-task { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .add-task select { border: 1px solid #ccc; border-radius: 6px; padding: 5px; font-size: 13px; }

    /* ── Print: one A4 landscape-ish page per station, pen columns ── */
    @media print {
      .no-print, .header, .date-bar, .banner, .add-task, .modal-bg { display: none !important; }
      body { background: #fff; }
      .ds-main { padding: 0; max-width: none; }
      .station { border: none; border-radius: 0; page-break-after: always; margin: 0; padding: 8px 0; }
      .station:last-child { page-break-after: auto; }
      .st-name { font-size: 22px; }
      .st-tbl { font-size: 13px; }
      .st-tbl td { padding: 12px 7px; border-bottom: 1px solid #999; }
      .st-tbl th { border-bottom: 2px solid #000; color: #000; }
      /* pen-friendly boxes */
      .in-h, .in-notes { border: 1px solid #999; background: #fff; height: 24px; }
      .in-who { appearance: none; -webkit-appearance: none; border: 1px solid #999; background: #fff; height: 24px; }
      input[type=checkbox] { width: 18px; height: 18px; }
      .st-empty { display: none; }
    }
</style>
